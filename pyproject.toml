[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agp-minimal"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "math-verify>=0.9,<1",
    "openai>=1.40",
    "sentence-transformers>=2.2",
    "torch>=2.3",
    "torch-geometric>=2.6",
    "transformers>=4.51",
]

[project.optional-dependencies]
gaia = [
    "av>=11",
    "faster-whisper>=1.2",
    "imageio-ffmpeg>=0.6",
    "numpy<2",
    "onnxruntime>=1.7",
    "opencv-python>=4.5,<4.10",
    "openpyxl>=3.1",
    "pyarrow>=15",
    "protobuf>=4.25.8,<6",
    "rapidocr-onnxruntime>=1.4",
    "requests>=2.31",
    "xlrd>=2.0",
]

[tool.setuptools.packages.find]
include = ["MAS_DAG*"]
